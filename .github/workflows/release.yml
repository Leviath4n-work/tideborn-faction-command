name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: |
          node --check tideborn-faction-command.user.js
          node scripts/check-release.mjs
      - name: Build release archive
        run: zip tideborn-faction-command-${GITHUB_REF_NAME}.zip tideborn-faction-command.user.js tideborn-faction-command.meta.js README.md CHANGELOG.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tideborn-faction-command-${GITHUB_REF_NAME}.zip tideborn-faction-command.user.js tideborn-faction-command.meta.js --generate-notes --title "Tideborn Faction Command ${GITHUB_REF_NAME}"
